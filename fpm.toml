name = "ecx"
version = "VERSION"
license = "MIT"
author = "Milan Skocic"
maintainer = "milan.skocic@icloud.com"
copyright = "Copyright, Milan Skocic"
categories  =["Science"]
keywords = ["electrochemistry", "impedance", "photoelectrochemistry"]
homepage = "https://milanskocic.github.io/ecx/index.html"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[dependencies]
stdlib = "*"
codata = { git="https://github.com/MilanSkocic/codata.git" }
ciaaw = { git="https://github.com/MilanSkocic/ciaaw.git" }
M_CLI2 = {git="https://github.com/urbanjost/M_CLI2.git"}


[install]
library = true

[[executable]]
name = "ecxcli"
main = "main.f90"

[[example]]
name="example_in_f"
main="example.f90"

[[example]]
name="example_in_c"
main="example.c"

[[test]]
name = "tester"
main = "tester.f90"

[test.dependencies]
test-drive = {git="https://github.com/fortran-lang/test-drive", tag="v0.5.0"}
